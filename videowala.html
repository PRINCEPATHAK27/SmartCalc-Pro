<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Views Increaser — SmartCalc Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .vw-wrap { background:#0A0C10; min-height:calc(100vh - 60px); }

  .vw-toolbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 5%; background:#12151B;
    border-bottom:1px solid #232A34; flex-wrap:wrap; gap:10px;
  }

  .vw-brand { display:flex; align-items:center; gap:10px; }
  .vw-dot { width:9px; height:9px; border-radius:50%; background:#FF4B3E; box-shadow:0 0 8px #FF4B3E; animation:vpulse 1.8s infinite; }
  .vw-brand h2 { font-family:'IBM Plex Mono',monospace; font-size:14px; color:#E8EAED; letter-spacing:2px; margin:0; }
  .vw-brand span { font-size:11px; color:#6B7480; font-family:'IBM Plex Mono',monospace; }

  .vw-layouts { display:flex; gap:6px; flex-wrap:wrap; }
  .vw-lb {
    font-family:'IBM Plex Mono',monospace; background:#14181F;
    border:1px solid #232A34; color:#6B7480;
    padding:6px 13px; border-radius:6px; cursor:pointer;
    font-size:12px; letter-spacing:1px; width:auto; margin:0;
    transition:all .15s;
  }
  .vw-lb:hover { border-color:#FFB020; color:#E8EAED; background:#14181F; }
  .vw-lb.active { background:#FFB020; color:#1a1200; border-color:#FFB020; font-weight:700; }

  #vwGrid {
    display:grid; gap:10px; padding:12px 5%;
    min-height:calc(100vh - 130px);
  }

  .vw-monitor {
    background:#14181F; border:1px solid #232A34;
    border-radius:12px; overflow:hidden;
    display:flex; flex-direction:column; min-height:180px;
  }

  .vw-head {
    display:flex; align-items:center; gap:8px;
    padding:8px 12px; background:#101318;
    border-bottom:1px solid #232A34;
  }

  .vw-led { width:7px; height:7px; border-radius:50%; background:#3A3F47; flex-shrink:0; }
  .vw-led.live { background:#5FD87A; box-shadow:0 0 6px #5FD87A; }
  .vw-ch { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B7480; white-space:nowrap; }

  .vw-form { flex:1; display:flex; gap:6px; min-width:0; }
  .vw-form input {
    flex:1; background:#0B0D11; border:1px solid #232A34;
    color:#E8EAED; font-family:'IBM Plex Mono',monospace;
    font-size:11px; padding:6px 8px; border-radius:6px;
    outline:none; margin:0;
  }
  .vw-form input:focus { border-color:#FFB020; }
  .vw-form button {
    background:#232A34; border:1px solid #232A34; color:#E8EAED;
    padding:6px 10px; border-radius:6px; cursor:pointer;
    font-size:12px; width:auto; margin:0; flex-shrink:0;
    font-family:'IBM Plex Mono',monospace;
  }
  .vw-form button:hover { background:#FFB020; color:#1a1200; transform:none; opacity:1; }

  .vw-body {
    flex:1; background:#000;
    display:flex; align-items:center; justify-content:center;
  }
  .vw-body iframe, .vw-body video { width:100%; height:100%; border:0; display:block; }
  .vw-placeholder { color:#6B7480; font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:center; padding:20px; }
  .vw-placeholder .big { font-size:32px; display:block; margin-bottom:8px; opacity:.4; }

  .vw-hint {
    padding:10px 5%; font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:#6B7480; background:#0A0C10;
    border-top:1px solid #232A34; text-align:center;
  }
  .vw-hint b { color:#FFB020; }

  @keyframes vpulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }

  @media(max-width:600px){
    #vwGrid { grid-template-columns:1fr !important; }
    .vw-hint { display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">SmartCalc <span>Pro</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="calculators.html">Calc</a>
    <a href="videowall.html" class="active">Views+</a>
    <button id="themeBtn">🌙</button>
  </nav>
</header>

<div class="vw-wrap">

  <div class="vw-toolbar">
    <div class="vw-brand">
      <div class="vw-dot"></div>
      <div>
        <h2>VIEWS INCREASER</h2>
        <span>MULTI-SCREEN LOOP PLAYER 🚀</span>
      </div>
    </div>
    <div class="vw-layouts" id="vwLayouts">
      <button class="vw-lb" data-n="1">1</button>
      <button class="vw-lb" data-n="2">2</button>
      <button class="vw-lb active" data-n="4">4</button>
      <button class="vw-lb" data-n="6">6</button>
      <button class="vw-lb" data-n="9">9</button>
    </div>
  </div>

  <div id="vwGrid"></div>

  <div class="vw-hint">
    YouTube URL paste karo → Enter dabao → video <b>loop</b> mein chalega → <b>Views boost</b> hoga! 🚀
  </div>

</div>

<script>
(function(){
  const grid = document.getElementById('vwGrid');
  const layouts = document.getElementById('vwLayouts');
  let count = 4, state = {};

  function cols(n){ return n<=2?n:n===4?2:3; }

  function ytId(url){
    const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function isVid(url){ return /\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url); }

  function load(i, url){
    const body = document.getElementById('vwb-'+i);
    const led  = document.getElementById('vwl-'+i);
    url = url.trim();
    if(!url){
      body.innerHTML = ph(i); led.classList.remove('live'); return;
    }
    const yt = ytId(url);
    if(yt){
      body.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt}?autoplay=1&loop=1&playlist=${yt}&rel=0&mute=1" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
    } else if(isVid(url)){
      body.innerHTML = `<video src="${url}" autoplay loop muted playsinline controls></video>`;
    } else {
      body.innerHTML = `<iframe src="${url}" allow="autoplay;encrypted-media" allowfullscreen></iframe>`;
    }
    led.classList.add('live');
  }

  function ph(i){
    return `<div class="vw-placeholder"><span class="big">▭</span>CH.${String(i+1).padStart(2,'0')} — URL paste karein</div>`;
  }

  function render(){
    const c = cols(count);
    grid.style.gridTemplateColumns = `repeat(${c},1fr)`;
    grid.style.gridTemplateRows = count<=2 ? '70vh' : `repeat(${Math.ceil(count/c)},${count<=4?'40vh':'30vh'})`;
    grid.innerHTML = '';
    for(let i=0;i<count;i++){
      const s = state[i]||{url:''};
      const el = document.createElement('div');
      el.className = 'vw-monitor';
      el.innerHTML = `
        <div class="vw-head">
          <span class="vw-led" id="vwl-${i}"></span>
          <span class="vw-ch">CH.${String(i+1).padStart(2,'0')}</span>
          <div class="vw-form">
            <input id="vwi-${i}" type="text" placeholder="YouTube / .mp4 URL..." value="${s.url?s.url.replace(/"/g,'&quot;'):''}">
            <button onclick="vwPlay(${i})">▶</button>
            <button onclick="vwClear(${i})">✕</button>
          </div>
        </div>
        <div class="vw-body" id="vwb-${i}">${ph(i)}</div>`;
      grid.appendChild(el);
      if(s.url) load(i, s.url);
      document.getElementById('vwi-'+i).addEventListener('keydown', e=>{ if(e.key==='Enter') vwPlay(i); });
    }
  }

  window.vwPlay = i => { const v=document.getElementById('vwi-'+i).value; state[i]={url:v}; load(i,v); };
  window.vwClear = i => { state[i]={url:''}; document.getElementById('vwi-'+i).value=''; load(i,''); };

  layouts.addEventListener('click', e=>{
    const b = e.target.closest('button');
    if(!b) return;
    layouts.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    count = parseInt(b.dataset.n);
    render();
  });

  render();

  // Theme btn
  document.addEventListener('DOMContentLoaded', ()=>{
    const btn = document.getElementById('themeBtn');
    if(btn) btn.onclick = ()=>{
      document.body.classList.toggle('dark');
      btn.innerHTML = document.body.classList.contains('dark') ? '☀️' : '🌙';
    };
  });
})();
</script>
</body>
</html>
